<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelRecommend · 재구현</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><strong><a href="/">TravelRecommend</a></strong><a href="/travel/list">여행상품</a><a href="/recommend">맞춤 추천</a><a th:if="${member!=null}" href="/reservations">내 예약</a><a th:if="${member!=null and member.role=='ADMIN'}" href="/admin">관리자</a><a th:if="${member==null}" href="/login">로그인</a><form class="inline" th:if="${member!=null}" method="post" action="/logout"><input type="hidden" name="_csrf" th:value="${csrf}"><button class="secondary">로그아웃</button></form></nav><main><section class="panel narrow"><span class="eyebrow">MEMBER</span><h1 th:text="${signup}?'회원가입':'다시 만나 반가워요'"></h1><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="${signup}?'/signup':'/login'"><input type="hidden" name="_csrf" th:value="${csrf}"><label>아이디<input name="username" required minlength="3" maxlength="30"></label><label>비밀번호<input type="password" name="password" required minlength="8" maxlength="72"></label><button th:text="${signup}?'가입하기':'로그인'"></button></form><p><a th:href="${signup}?'/login':'/signup'" th:text="${signup}?'로그인으로 이동':'새 계정 만들기'"></a></p></section><footer>이수빈 · 자료 기반 재구현 / 가상 여행상품을 사용하는 학습용 서비스</footer></main></body></html>
