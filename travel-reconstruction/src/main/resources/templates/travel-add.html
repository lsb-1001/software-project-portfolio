<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelRecommend · 재구현</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><strong><a href="/">TravelRecommend</a></strong><a href="/travel/list">여행상품</a><a href="/recommend">맞춤 추천</a><a th:if="${member!=null}" href="/reservations">내 예약</a><a th:if="${member!=null and member.role=='ADMIN'}" href="/admin">관리자</a><a th:if="${member==null}" href="/login">로그인</a><form class="inline" th:if="${member!=null}" method="post" action="/logout"><input type="hidden" name="_csrf" th:value="${csrf}"><button class="secondary">로그아웃</button></form></nav><main><section class="panel narrow"><h1>여행상품 등록</h1><form method="post" action="/travel/add"><input type="hidden" name="_csrf" th:value="${csrf}"><label>상품명<input name="title" required maxlength="150"></label><label>국가<input name="country" required maxlength="50"></label><label>가격<input name="price" type="number" min="1" required></label><label>스타일<select name="style"><option>힐링</option><option>관광</option><option>먹방</option><option>액티비티</option></select></label><label>설명<textarea name="description" maxlength="250"></textarea></label><label>출발일<input name="startDate" type="date" required></label><label>정원<input name="capacity" type="number" min="1" max="1000" required></label><button>등록</button></form></section><footer>이수빈 · 자료 기반 재구현 / 가상 여행상품을 사용하는 학습용 서비스</footer></main></body></html>
