<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelRecommend · 재구현</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><strong><a href="/">TravelRecommend</a></strong><a href="/travel/list">여행상품</a><a href="/recommend">맞춤 추천</a><a th:if="${member!=null}" href="/reservations">내 예약</a><a th:if="${member!=null and member.role=='ADMIN'}" href="/admin">관리자</a><a th:if="${member==null}" href="/login">로그인</a><form class="inline" th:if="${member!=null}" method="post" action="/logout"><input type="hidden" name="_csrf" th:value="${csrf}"><button class="secondary">로그아웃</button></form></nav><main><h1 th:text="${admin}?'전체 예약 현황':'내 예약'"></h1><p th:if="${admin}"><a class="button" href="/travel/add">새 상품 등록</a></p><section class="panel"><p th:if="${#lists.isEmpty(reservations)}">아직 예약이 없습니다.</p><table th:unless="${#lists.isEmpty(reservations)}"><tr><th>상품</th><th>예약자</th><th>인원</th><th></th></tr><tr th:each="r:${reservations}"><td th:text="${travelMap[r.travelId].title}"></td><td th:text="${r.username}"></td><td th:text="${r.people}"></td><td><form th:if="${!admin}" method="post" th:action="@{/reservation/cancel/{id}(id=${r.id})}"><input type="hidden" name="_csrf" th:value="${csrf}"><button class="secondary">예약 취소</button></form></td></tr></table></section><footer>이수빈 · 자료 기반 재구현 / 가상 여행상품을 사용하는 학습용 서비스</footer></main></body></html>
