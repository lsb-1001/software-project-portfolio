<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelRecommend · 재구현</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><strong><a href="/">TravelRecommend</a></strong><a href="/travel/list">여행상품</a><a href="/recommend">맞춤 추천</a><a th:if="${member!=null}" href="/reservations">내 예약</a><a th:if="${member!=null and member.role=='ADMIN'}" href="/admin">관리자</a><a th:if="${member==null}" href="/login">로그인</a><form class="inline" th:if="${member!=null}" method="post" action="/logout"><input type="hidden" name="_csrf" th:value="${csrf}"><button class="secondary">로그아웃</button></form></nav><main><span class="eyebrow">YOUR SELECTION</span><h1>조건에 맞춰 고른 여행</h1><div class="notice"><strong th:text="${mode}"></strong><p th:text="'후보 '+${candidateCount}+'개에서 최대 3개를 선택했습니다.'"></p></div><p th:if="${#lists.isEmpty(choices)}">조건에 맞는 상품이 없습니다. 예산이나 국가 조건을 조정해 주세요.</p><div class="grid"><article class="card" th:each="c:${choices}"><div class="art" th:text="${c.travel.country}"></div><span class="tag" th:text="${c.travel.style}"></span><h2 th:text="${c.travel.title}"></h2><p class="price" th:text="${#numbers.formatInteger(c.travel.price,3,'COMMA')}+'원'"></p><p th:text="${c.reason}"></p><a class="button" th:href="@{/reservation/form/{id}(id=${c.travel.id})}">예약하기</a></article></div><p><a href="/recommend">← 조건 다시 선택</a></p><footer>이수빈 · 자료 기반 재구현 / 가상 여행상품을 사용하는 학습용 서비스</footer></main></body></html>
