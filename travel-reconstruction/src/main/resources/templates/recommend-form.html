<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelRecommend · 재구현</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><strong><a href="/">TravelRecommend</a></strong><a href="/travel/list">여행상품</a><a href="/recommend">맞춤 추천</a><a th:if="${member!=null}" href="/reservations">내 예약</a><a th:if="${member!=null and member.role=='ADMIN'}" href="/admin">관리자</a><a th:if="${member==null}" href="/login">로그인</a><form class="inline" th:if="${member!=null}" method="post" action="/logout"><input type="hidden" name="_csrf" th:value="${csrf}"><button class="secondary">로그아웃</button></form></nav><main><section class="panel narrow"><span class="eyebrow">FIND YOUR TRIP</span><h1>어떤 여행을 원하세요?</h1><form method="post" action="/recommend"><input type="hidden" name="_csrf" th:value="${csrf}"><label>여행 스타일<select name="style"><option>힐링</option><option>관광</option><option>먹방</option><option>액티비티</option></select></label><label>1인 예산<input name="budget" type="number" min="1" value="1500000" required></label><label>선호 국가<select name="country"><option value="">전체</option><option>일본</option><option>한국</option><option>대만</option><option>베트남</option><option>태국</option></select></label><label>제외할 내용<input name="avoid" maxlength="100" placeholder="상품명·설명에서 제외할 단어"></label><label>여행 목적<textarea name="purpose" maxlength="1000" placeholder="예: 조용한 곳에서 쉬고 싶어요"></textarea></label><button>추천 결과 보기</button></form></section><footer>이수빈 · 자료 기반 재구현 / 가상 여행상품을 사용하는 학습용 서비스</footer></main></body></html>
