<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelRecommend · 재구현</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><strong><a href="/">TravelRecommend</a></strong><a href="/travel/list">여행상품</a><a href="/recommend">맞춤 추천</a><a th:if="${member!=null}" href="/reservations">내 예약</a><a th:if="${member!=null and member.role=='ADMIN'}" href="/admin">관리자</a><a th:if="${member==null}" href="/login">로그인</a><form class="inline" th:if="${member!=null}" method="post" action="/logout"><input type="hidden" name="_csrf" th:value="${csrf}"><button class="secondary">로그아웃</button></form></nav><main><h1>여행상품</h1><p class="muted">재구현용 가상 상품 200개 · 가격과 예약 가능 인원을 확인하세요.</p><div class="grid"><article class="card" th:each="t:${travelList}"><div class="art" th:text="${t.country}"></div><span class="tag" th:text="${t.style}"></span><h2 th:text="${t.title}"></h2><p class="muted" th:text="${t.description}"></p><p class="price" th:text="${#numbers.formatInteger(t.price,3,'COMMA')}+'원'"></p><p th:text="${t.startDate}+' · 잔여 '+${t.capacity-t.reserved}+'명'"></p><a class="button" th:href="@{/reservation/form/{id}(id=${t.id})}">예약하기</a></article></div><footer>이수빈 · 자료 기반 재구현 / 가상 여행상품을 사용하는 학습용 서비스</footer></main></body></html>
