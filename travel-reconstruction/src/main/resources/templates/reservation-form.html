<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelRecommend · 재구현</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><strong><a href="/">TravelRecommend</a></strong><a href="/travel/list">여행상품</a><a href="/recommend">맞춤 추천</a><a th:if="${member!=null}" href="/reservations">내 예약</a><a th:if="${member!=null and member.role=='ADMIN'}" href="/admin">관리자</a><a th:if="${member==null}" href="/login">로그인</a><form class="inline" th:if="${member!=null}" method="post" action="/logout"><input type="hidden" name="_csrf" th:value="${csrf}"><button class="secondary">로그아웃</button></form></nav><main><section class="panel narrow"><span class="eyebrow">RESERVATION</span><h1 th:text="${travel.title}"></h1><p th:text="${travel.startDate}+' 출발'"></p><p th:text="'잔여 '+${travel.capacity-travel.reserved}+'명'"></p><form method="post" action="/reservation/save"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="travelId" th:value="${travel.id}"><label>예약 인원<input type="number" name="people" min="1" th:max="${travel.capacity-travel.reserved}" value="1" required></label><button>예약 확정</button></form></section><footer>이수빈 · 자료 기반 재구현 / 가상 여행상품을 사용하는 학습용 서비스</footer></main></body></html>
