<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyBoard 게시판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
    }
    .header-gradient {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .post-card {
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="font-sans">
  <!-- 상단 네비게이션 (반응형: 모바일 토글 포함) -->
  <header class="header-gradient shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <a href="/" class="flex items-center space-x-2">
          <img src="/static/pslw.png" alt="MyBoard" class="h-12" />
          <span class="text-white font-bold text-xl hidden sm:inline">MyBoard</span>
        </a>

        <div class="flex items-center">
          <nav class="hidden md:flex items-center space-x-6">
            <a href="/write.html" class="text-white hover:text-gray-200 font-semibold transition">글쓰기</a>
            <a href="/category.html?category=공지" class="text-white hover:text-gray-200 font-semibold transition">공지</a>
            <a href="/category.html?category=자유" class="text-white hover:text-gray-200 font-semibold transition">자유</a>
            <a href="/category.html?category=질문" class="text-white hover:text-gray-200 font-semibold transition">질문</a>
          </nav>

          <div id="authContainer" class="hidden md:block text-white ml-6"></div>

          <button id="mobileMenuButton" class="md:hidden ml-3 text-white" onclick="toggleMobileMenu()" aria-label="메뉴 토글">
            <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
      </div>

      <div id="mobileMenu" class="md:hidden hidden mt-3 px-2 pb-3">
        <a href="/write.html" class="block text-white px-3 py-2 rounded hover:bg-gray-700">글쓰기</a>
        <a href="/category.html?category=공지" class="block text-white px-3 py-2 rounded hover:bg-gray-700">공지</a>
        <a href="/category.html?category=자유" class="block text-white px-3 py-2 rounded hover:bg-gray-700">자유</a>
        <a href="/category.html?category=질문" class="block text-white px-3 py-2 rounded hover:bg-gray-700">질문</a>
        <div id="mobileAuthContainer" class="px-3 mt-2"></div>
      </div>
    </div>
  </header>

  <!-- 메인 콘텐츠 -->
  <main class="max-w-7xl mx-auto px-4 py-12">
    <!-- 히어로 섹션 -->
    <div class="bg-white rounded-lg shadow-lg p-8 mb-12">
      <h1 class="text-4xl font-bold text-gray-800 mb-2">MyBoard</h1>
      <p class="text-gray-600 text-lg">함께 나누고, 소통하고, 성장하는 커뮤니티</p>
    </div>

    <!-- 게시판 섹션들 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- 공지사항 -->
      <section class="lg:col-span-1">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
          <div class="bg-gradient-to-r from-blue-500 to-blue-600 p-4">
            <h2 class="text-xl font-bold text-white">📢 공지사항</h2>
          </div>
          <div id="noticesContainer" class="p-4 space-y-3"></div>
          <div class="p-4 border-t">
            <a href="category.html?category=공지" class="text-blue-600 hover:text-blue-800 font-semibold text-sm">전체보기 →</a>
          </div>
        </div>
      </section>

      <!-- 자유게시판 -->
      <section class="lg:col-span-1">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
          <div class="bg-gradient-to-r from-green-500 to-green-600 p-4">
            <h2 class="text-xl font-bold text-white">💬 자유게시판</h2>
          </div>
          <div id="freeContainer" class="p-4 space-y-3"></div>
          <div class="p-4 border-t">
            <a href="category.html?category=자유" class="text-green-600 hover:text-green-800 font-semibold text-sm">전체보기 →</a>
          </div>
        </div>
      </section>

      <!-- 질문게시판 -->
      <section class="lg:col-span-1">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
          <div class="bg-gradient-to-r from-purple-500 to-purple-600 p-4">
            <h2 class="text-xl font-bold text-white">❓ 질문게시판</h2>
          </div>
          <div id="questionContainer" class="p-4 space-y-3"></div>
          <div class="p-4 border-t">
            <a href="category.html?category=질문" class="text-purple-600 hover:text-purple-800 font-semibold text-sm">전체보기 →</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- 푸터 -->
  <footer class="bg-gray-800 text-gray-300 py-8 mt-16">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p>&copy; 2025 MyBoard. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // 사용자 인증 상태 확인 및 UI 업데이트
    async function checkUserAuth() {
      try {
        const res = await fetch('/user/check');
        const data = await res.json();
        const authContainer = document.getElementById('authContainer');
        window.CURRENT_USER = data.logged_in ? data.username : null;
        window.IS_ADMIN = data.logged_in ? data.is_admin : false;
        
        if (data.logged_in) {
          let adminLink = '';
          if (data.is_admin) {
            adminLink = `<a href="/admin.html" class="bg-yellow-500 hover:bg-yellow-600 px-3 py-1 rounded text-sm font-semibold text-white transition">관리</a>`;
          }
          const authHTML = `
            <div class="flex items-center space-x-3">
              <span class="font-semibold">${data.username}님</span>
              ${adminLink}
              <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-semibold transition">로그아웃</button>
            </div>
          `;
          authContainer.innerHTML = authHTML;
          const mobileAuth = document.getElementById('mobileAuthContainer');
          if (mobileAuth) mobileAuth.innerHTML = authHTML;
        } else {
          const authHTML = `
            <div class="flex items-center space-x-3">
              <a href="/login.html" class="bg-white text-purple-600 hover:bg-gray-100 px-3 py-1 rounded text-sm font-semibold transition">로그인</a>
              <a href="/register.html" class="bg-green-500 hover:bg-green-600 px-3 py-1 rounded text-sm font-semibold text-white transition">회원가입</a>
            </div>
          `;
          authContainer.innerHTML = authHTML;
          const mobileAuth = document.getElementById('mobileAuthContainer');
          if (mobileAuth) mobileAuth.innerHTML = authHTML;
        }
      } catch (error) {
        console.error('인증 상태 확인 오류:', error);
      }
    }

    async function logout() {
      if (confirm('정말 로그아웃하시겠습니까?')) {
        try {
          const res = await fetch('/logout', { method: 'POST' });
          if (res.ok) {
            alert('✅ 로그아웃되었습니다.');
            window.location.reload();
          }
        } catch (error) {
          alert('❌ 로그아웃 중 오류가 발생했습니다.');
        }
      }
    }

    function toggleMobileMenu() {
      const el = document.getElementById('mobileMenu');
      if (!el) return;
      el.classList.toggle('hidden');
    }

    async function loadPostsByCategory(category, containerId) {
      const res = await fetch("/posts?category=" + encodeURIComponent(category));
      const data = await res.json();
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      const posts = data.posts.slice(0, 4);

      if (posts.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-sm">아직 게시물이 없습니다.</p>';
        return;
      }

      for (const post of posts) {
        const postDiv = document.createElement("div");
        postDiv.className = "post-card bg-gray-50 p-3 rounded hover:bg-gray-100 cursor-pointer border-l-4 " + 
          (post[2] ? "border-blue-500" : "border-gray-300");

        const titleLink = document.createElement("a");
        titleLink.href = `post.html?id=${post[0]}`;
        titleLink.className = "block text-sm font-semibold text-gray-800 hover:text-blue-600 truncate";
        titleLink.textContent = post[1];
        postDiv.appendChild(titleLink);

        const meta = document.createElement("div");
        meta.className = "text-xs text-gray-500 mt-1";
        // 기본 메타
        let metaHtml = `${post[3]} · 작성자 ${post[5]} · 조회 ${post[6]} · 댓글 ${post[4]}`;
        // 관리자에게만 욕설 수치/단계 표시 (critical은 high와 병합하여 표시)
        if (window.IS_ADMIN) {
          const score = Number(post[7] || 0).toFixed(3);
          const level = post[8] || 'none';
          const displayLevel = level === 'critical' ? 'high' : level;
          const color = (level === 'high' || level === 'critical') ? 'bg-orange-600' : level === 'mid' ? 'bg-yellow-500' : level === 'low' ? 'bg-blue-500' : 'bg-green-500';
          metaHtml += ` · <span class="ml-2 inline-flex items-center ${color} text-white text-xs font-semibold px-2 py-0.5 rounded">욕설: ${score} (${displayLevel})</span>`;
        }
        meta.innerHTML = metaHtml;
        postDiv.appendChild(meta);
        container.appendChild(postDiv);
      }
    }

    function loadAllPosts() {
      loadPostsByCategory("공지", "noticesContainer");
      loadPostsByCategory("자유", "freeContainer");
      loadPostsByCategory("질문", "questionContainer");
    }

    // 페이지 로드 시 실행
    window.addEventListener('load', () => {
      checkUserAuth();
      loadAllPosts();
    });
  </script>
</body>
</html>
